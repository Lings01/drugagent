[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugagent"
version = "0.1.0"
description = "Drug discovery agent: target prep, screening, binder design, nanobody design, MD"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain-openai",
    "typer",
    "loguru",
    "requests",
    "joblib",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "rdkit",
    "biopython",
    "MDAnalysis",
    "plotly",
    "kaleido",
    "weasyprint",
    "mordred",
    "tqdm",
]

[project.scripts]
drugagent = "drugagent.cli:app"

[tool.setuptools.packages.find]
include = ["drugagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests (GPU/CPU heavy)",
    "net: need internet",
]
addopts = "-q --strict-markers"
